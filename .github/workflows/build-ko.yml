name: Build Android Kernel Module

on:
  workflow_dispatch:

jobs:
  build_ko:
    runs-on: ubuntu-22.04

    env:
      ARCH: x86_64
      CROSS_COMPILE: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev

      - name: Inspect kernel tree
        run: |
          pwd
          ls
          ls scripts | head || true
          head -20 Makefile

      - name: Find defconfig
        run: |
          find arch -name "*defconfig" | head -20

      - name: Configure kernel
        run: |
          make defconfig || true

      - name: Build module
        run: |
          make M=drivers/gpu V=1 || true

      - name: Find ko
        run: |
          find . -name "*.ko"

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: kernel_module
          path: "**/*.ko"
