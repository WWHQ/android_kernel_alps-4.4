name: Build Android Kernel Module

on:
  workflow_dispatch:

env:
  ARCH: x86_64
  CROSS_COMPILE: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_ko:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves

      - name: Configure kernel
        run: |
          make x86_64_defconfig

          # 强制开启模块支持
          scripts/config --enable MODULES || true
          scripts/config --module DRM || true

          make oldconfig
          make prepare
          make modules_prepare

      - name: Build GPU modules
        run: |
          make M=drivers/gpu modules V=1

      - name: List built modules
        run: |
          find drivers/gpu -name "*.ko" -o -name "*.o" | head -200
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel_modules
          path: |
            **/*.ko
