name: Build Android Kernel Module

on:
  workflow_dispatch:

env:
  ARCH: x86_64
  CROSS_COMPILE: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_ko:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves

      - name: Configure kernel
        run: |
          # 使用默认 x86_64 配置
          make x86_64_defconfig

          # 强制开启模块支持
          scripts/config --enable MODULES || true
          scripts/config --enable DRM || true

          # 强制开启 PREEMPT
          scripts/config --enable PREEMPT || true

          # 清理 localversion
          sed -i 's/^CONFIG_LOCALVERSION.*/CONFIG_LOCALVERSION=""/' .config

          # 重新生成配置文件
          make oldconfig
          make prepare
          make modules_prepare

      - name: Build rmm modules
        run: |
          make ARCH=x86_64 M=drivers/rmm modules V=1

      - name: List built modules
        run: |
          find drivers/rmm -name "*.ko" -o -name "*.o" | head -200
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel_modules
          path: |
            **/*.ko
