name: Build Android Kernel Module

on:
  workflow_dispatch:

env:
  ARCH: x86_64
  CROSS_COMPILE: ""

jobs:
  build_ko:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves

      - name: Configure kernel
        run: |
          make x86_64_defconfig
          scripts/config --enable CONFIG_MODULES || true
          scripts/config --enable CONFIG_DRM || true
          scripts/config --enable CONFIG_PREEMPT || true
          sed -i 's/^CONFIG_LOCALVERSION.*/CONFIG_LOCALVERSION=""/' .config
          touch .scmversion
          make oldconfig
          make prepare
          make modules_prepare

      - name: Build rmm modules
        run: |
          make ARCH=x86_64 M=drivers/rmm modules V=1

      - name: List built modules
        run: |
          find drivers/rmm -name "*.ko" -o -name "*.o" | head -200
          find . -name "*.ko"

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kernel_modules
          path: |
            **/*.ko
